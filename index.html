<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow"></div>
    <div class="glow right"></div>

    <div class="container">
        <div class="card">
            <h2>Criar Conta</h2>
            <form id="form-cadastro">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="cad-nome" placeholder="Seu nome completo" required>
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="cad-email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="cad-senha" placeholder="••••••••" required>
                </div>
                <button type="submit">Cadastrar</button>
            </form>
            <div id="res-cadastro" class="response-box"></div>
        </div>

        <div class="card">
            <h2>Fazer Login</h2>
            <form id="form-login">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="login-email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-senha" placeholder="••••••••" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
            <div id="res-login" class="response-box"></div>
        </div>

        <div class="card full-width">
            <h2>Área Protegida</h2>
            <div id="auth-status" class="status-badge">Não Autenticado</div>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.875rem;">
                Acesse esta área usando o token JWT gerado pelo login. Se você não estiver logado, a API rejeitará a requisição.
            </p>
            <button id="btn-acessar">Testar Acesso à Área Protegida</button>
            <button id="btn-logout" class="secondary" style="display: none;">Sair (Apagar Token)</button>
            
            <div id="res-protegida" class="response-box" style="margin-top: 1.5rem;"></div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        
        function showMessage(elementId, text, isError = false) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = 'response-box ' + (isError ? 'error' : 'success');
        }

        function updateUI() {
            const token = localStorage.getItem('token');
            const statusBadge = document.getElementById('auth-status');
            const btnLogout = document.getElementById('btn-logout');

            if (token) {
                statusBadge.textContent = "Autenticado";
                statusBadge.className = "status-badge logged-in";
                btnLogout.style.display = "block";
            } else {
                statusBadge.textContent = "Não Autenticado";
                statusBadge.className = "status-badge";
                btnLogout.style.display = "none";
            }
        }

        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.textContent = "Aguarde...";
            
            const payload = {
                nome: document.getElementById('cad-nome').value,
                email: document.getElementById('cad-email').value,
                senha: document.getElementById('cad-senha').value
            };

            try {
                const res = await fetch(`${API_URL}/cadastro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage('res-cadastro', data.mensagem);
                    e.target.reset();
                } else {
                    showMessage('res-cadastro', data.detail, true);
                }
            } catch (err) {
                showMessage('res-cadastro', "Erro de conexão. A API está rodando?", true);
            }
            btn.textContent = "Cadastrar";
        });

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.textContent = "Autenticando...";
            
            const payload = {
                email: document.getElementById('login-email').value,
                senha: document.getElementById('login-senha').value
            };

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    showMessage('res-login', "Login realizado com sucesso!");
                    updateUI();
                    e.target.reset();
                } else {
                    showMessage('res-login', data.detail, true);
                }
            } catch (err) {
                showMessage('res-login', "Erro de conexão. A API está rodando?", true);
            }
            btn.textContent = "Entrar";
        });

        document.getElementById('btn-acessar').addEventListener('click', async (e) => {
            const btn = e.target;
            btn.textContent = "Verificando...";
            const token = localStorage.getItem('token');

            try {
                const res = await fetch(`${API_URL}/area-protegida`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage('res-protegida', data.mensagem);
                } else {
                    showMessage('res-protegida', data.detail || "Não autorizado", true);
                }
            } catch (err) {
                showMessage('res-protegida', "Erro de conexão.", true);
            }
            btn.textContent = "Testar Acesso à Área Protegida";
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('token');
            updateUI();
            showMessage('res-protegida', "Você saiu da conta e o token foi apagado.");
            document.getElementById('res-login').style.display = 'none';
        });

        updateUI();
    </script>
</body>
</html>
